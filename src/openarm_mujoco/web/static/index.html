<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Welcome to OpenArm</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <style>
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(
            circle at 20% 20%,
            rgba(13, 110, 253, 0.18),
            transparent 55%
          ),
          radial-gradient(
            circle at 80% 60%,
            rgba(102, 16, 242, 0.15),
            transparent 50%
          );
      }
      /* QR codes need a light quiet zone to scan reliably, so this panel
         stays white regardless of the page theme. */
      .qr-panel {
        background: #fff;
        border-radius: 0.75rem;
        padding: 0.75rem;
        line-height: 0;
      }
      .qr-panel img {
        width: 180px;
        height: 180px;
        display: block;
      }
    </style>
  </head>
  <body>
    <main class="container text-center py-5">
      <h1 class="display-4 fw-bold mb-3">Welcome to OpenArm</h1>
      <p class="lead text-body-secondary mb-4">
        by <span class="fw-semibold">Couliglig</span>
      </p>

      <!-- The arm is baked into the link, so each phone drives exactly one. -->
      <div id="phone-block" class="d-none">
        <p class="text-body-secondary mb-3">Register this phone as</p>
        <div class="d-flex gap-3 justify-content-center flex-wrap">
          <a class="btn btn-primary btn-lg px-4" href="/register?arm=left"
            >Left arm</a
          >
          <a class="btn btn-primary btn-lg px-4" href="/register?arm=right"
            >Right arm</a
          >
        </div>
      </div>

      <div id="qr-block" class="d-none">
        <p class="text-body-secondary mb-4">
          Bimanual control needs two phones &mdash; scan one code per arm
        </p>
        <div class="row g-4 justify-content-center" id="qr-row"></div>
        <p id="qr-error" class="small text-danger mt-3 mb-0"></p>
      </div>
    </main>

    <script src="/static/device.js"></script>
    <script>
      const ARMS = ["left", "right"];
      const { isPhone } = detectDevice();

      if (isPhone) {
        document.getElementById("phone-block").classList.remove("d-none");
      } else {
        document.getElementById("qr-block").classList.remove("d-none");
        // Ask the server which URL the phone should open — the browser's own
        // origin may be localhost, which is useless in a QR code.
        fetch("/api/public-url")
          .then((r) => r.json())
          .then(({ url }) => {
            const row = document.getElementById("qr-row");
            for (const arm of ARMS) {
              const target = `${url}/register?arm=${arm}`;
              const col = document.createElement("div");
              col.className = "col-auto";
              col.innerHTML = `
                <h2 class="h6 text-uppercase text-body-secondary mb-3">
                  ${arm} arm
                </h2>
                <div class="d-inline-block qr-panel">
                  <img alt="QR code to control the ${arm} arm"
                       src="/qr.svg?url=${encodeURIComponent(target)}">
                </div>
                <p class="small text-body-secondary mt-2 mb-0">
                  <code>?arm=${arm}</code>
                </p>`;
              row.append(col);
            }
          })
          .catch(() => {
            document.getElementById("qr-error").textContent =
              "Could not determine the server URL.";
          });
      }
    </script>
  </body>
</html>
